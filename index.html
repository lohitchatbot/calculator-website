<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta
      name="description"
      content="EasyCalc: Free online basic and scientific calculator for everyday math. Perfect for school, work, and home use with percentage calculations, trigonometry, logs, and dark mode support."
    />
    <meta name="keywords" content="online calculator, scientific calculator, basic calculator, percentage calculator, math calculator, free calculator, easy calculator">
    <meta name="author" content="EasyCalc">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://calculator-website-rose.vercel.app/">
    <meta property="og:title" content="EasyCalc - Free Online Basic & Scientific Calculator">
    <meta property="og:description" content="Fast and simple calculator for everyday math. Basic arithmetic, scientific functions, percentage calculations, and dark mode - all free.">
    <meta property="og:image" content="https://calculator-website-rose.vercel.app/images/og-image.png">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://calculator-website-rose.vercel.app/">
    <meta property="twitter:title" content="EasyCalc - Free Online Basic & Scientific Calculator">
    <meta property="twitter:description" content="Fast and simple calculator for everyday math. Basic arithmetic, scientific functions, percentage calculations, and dark mode - all free.">
    <meta property="twitter:image" content="https://calculator-website-rose.vercel.app/images/og-image.png">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://calculator-website-rose.vercel.app/">
    
    <title>EasyCalc - Free Online Basic & Scientific Calculator | Everyday Math Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    
    <!-- JSON-LD Structured Data for Calculator -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "EasyCalc",
      "description": "Free online basic and scientific calculator for everyday math. Features percentage calculations, trigonometry, logarithms, and dark mode support.",
      "url": "https://calculator-website-rose.vercel.app/",
      "applicationCategory": "CalculatorApplication",
      "operatingSystem": "All",
      "author": {
        "@type": "Organization",
        "name": "EasyCalc"
      },
      "featureList": "Basic arithmetic, scientific calculations, percentage calculator, trigonometry, logarithms, dark mode, calculation history",
      "license": "https://opensource.org/licenses/MIT"
    }
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-bar">
        <a class="brand" href="index.html">EasyCalc</a>
        
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <main class="container main-grid">
      <section class="main-content">
        <h1>EasyCalc - Free Online Calculator for Everyday Math</h1>
        
        <section class="calculator-card" aria-label="Calculator">
          <div class="calculator-toolbar">
            <div class="tabs" role="tablist" aria-label="Calculator modes">
              <button
                role="tab"
                class="tab-btn active"
                aria-selected="true"
                aria-controls="basicPanel"
                id="basic-tab"
              >
                Basic
              </button>
              <button
                role="tab"
                class="tab-btn"
                aria-selected="false"
                aria-controls="scientificPanel"
                id="scientific-tab"
                tabindex="-1"
              >
                Scientific
              </button>
            </div>
            <div class="toolbar-actions">
              <button class="ghost-btn" id="copyResult">Copy result</button>
              <button class="ghost-btn" id="modeToggle">Deg</button>
            </div>
          </div>

          <div class="display-area">
            <div class="history-preview" id="historyPreview">No calculations yet.</div>
            <div class="display" id="display">0</div>
          </div>

          <div
            role="tabpanel"
            class="calculator-panel active"
            id="basicPanel"
            aria-labelledby="basic-tab"
          >
            <div class="button-grid basic-grid">
              <button class="btn action" data-value="clear">C</button>
              <button class="btn action" data-value="backspace">⌫</button>
              <button class="btn action" data-value="percent">%</button>
              <button class="btn operator" data-value="/">÷</button>
              <button class="btn number" data-value="7">7</button>
              <button class="btn number" data-value="8">8</button>
              <button class="btn number" data-value="9">9</button>
              <button class="btn operator" data-value="*">×</button>
              <button class="btn number" data-value="4">4</button>
              <button class="btn number" data-value="5">5</button>
              <button class="btn number" data-value="6">6</button>
              <button class="btn operator" data-value="-">−</button>
              <button class="btn number" data-value="1">1</button>
              <button class="btn number" data-value="2">2</button>
              <button class="btn number" data-value="3">3</button>
              <button class="btn operator" data-value="+">+</button>
              <button class="btn number" data-value="0">0</button>
              <button class="btn number" data-value=".">.</button>
              <button class="btn action" data-value="negate">±</button>
              <button class="btn equals" data-value="=">=</button>
            </div>
          </div>

          <div class="calculator-panel" id="scientificPanel" role="tabpanel" aria-labelledby="scientific-tab">
            <div class="button-grid scientific-grid">
              <button class="btn function" data-value="sin(">sin</button>
              <button class="btn function" data-value="cos(">cos</button>
              <button class="btn function" data-value="tan(">tan</button>
              <button class="btn function" data-value="log(">log</button>
              <button class="btn function" data-value="ln(">ln</button>
              <button class="btn function" data-value="exp(">exp</button>
              <button class="btn function" data-value="pi">π</button>
              <button class="btn function" data-value="e">e</button>
              <button class="btn function" data-value="^2">x²</button>
              <button class="btn function" data-value="^3">x³</button>
              <button class="btn function" data-value="^">xʸ</button>
              <button class="btn function" data-value="sqrt(">√</button>
              <button class="btn function" data-value="cbrt(">∛</button>
              <button class="btn function" data-value="!">x!</button>
              <button class="btn function" data-value="(">(</button>
              <button class="btn function" data-value=")">)</button>
              <button class="btn action" data-value="clear">C</button>
              <button class="btn action" data-value="backspace">⌫</button>
              <button class="btn operator" data-value="/">÷</button>
              <button class="btn operator" data-value="*">×</button>
              <button class="btn number" data-value="7">7</button>
              <button class="btn number" data-value="8">8</button>
              <button class="btn number" data-value="9">9</button>
              <button class="btn operator" data-value="-">−</button>
              <button class="btn number" data-value="4">4</button>
              <button class="btn number" data-value="5">5</button>
              <button class="btn number" data-value="6">6</button>
              <button class="btn operator" data-value="+">+</button>
              <button class="btn number" data-value="1">1</button>
              <button class="btn number" data-value="2">2</button>
              <button class="btn number" data-value="3">3</button>
              <button class="btn equals" data-value="=">=</button>
              <button class="btn number" data-value="0">0</button>
              <button class="btn number" data-value=".">.</button>
              <button class="btn action" data-value="negate">±</button>
              <button class="btn action" data-value="percent">%</button>
            </div>
          </div>
        </section>

        
      </section>

      <aside class="sidebar">
        <section class="history-card">
          <div class="card-title-row">
            <h2>Calculation history</h2>
            <button class="ghost-btn" id="clearHistory">Clear</button>
          </div>
          <ul id="historyList" class="history-list"></ul>
        </section>

        
      </aside>
    </main>

    

    <script src="js/calculator.js"></script>
    <script src="js/history.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
